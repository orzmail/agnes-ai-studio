<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agnes AI Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Agnes AI Studio</h1>
  <div class="hdr-right">
    <span id="status-dot" class="dot gray" title="未配置"></span>
    <button id="btn-settings">设置</button>
  </div>
</header>

<nav id="tabs">
  <button class="tab active" data-tab="txt2img">文生图</button>
  <button class="tab" data-tab="img2img">图生图</button>
  <button class="tab" data-tab="txt2video">文生视频</button>
  <button class="tab" data-tab="gallery">画廊</button>
</nav>

<main>
  <section class="panel active" id="txt2img">
    <label>提示词
      <textarea id="t2i-prompt" placeholder="描述你想生成的画面..."></textarea>
    </label>
    <div class="row">
      <label>数量<input id="t2i-n" type="number" value="1" min="1" max="4"></label>
      <label>尺寸<select id="t2i-size">
        <option>1024x1024</option><option>1280x720</option><option>720x1280</option>
      </select></label>
    </div>
    <button class="primary" id="t2i-go">生成</button>
    <div class="result" id="t2i-result"></div>
  </section>

  <section class="panel" id="img2img">
    <label>参考图<input id="i2i-file" type="file" accept="image/*"></label>
    <div id="i2i-preview" class="preview"></div>
    <label>提示词<textarea id="i2i-prompt" placeholder="基于参考图的修改指令..."></textarea></label>
    <div class="row">
      <label>数量<input id="i2i-n" type="number" value="1" min="1" max="4"></label>
      <label>尺寸<select id="i2i-size">
        <option>1024x1024</option><option>1280x720</option><option>720x1280</option>
      </select></label>
    </div>
    <button class="primary" id="i2i-go">生成</button>
    <div class="result" id="i2i-result"></div>
  </section>

  <section class="panel" id="txt2video">
    <label>提示词<textarea id="t2v-prompt" placeholder="描述你想生成的视频..."></textarea></label>
    <label>模型<select id="t2v-model">
      <option value="agnes-video-v2.0">agnes-video-v2.0</option>
    </select></label>
    <div class="row">
      <label>时长(秒)<input id="t2v-seconds" type="number" value="5" min="1" max="10"></label>
      <label>比例<select id="t2v-ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></label>
    </div>
    <button class="primary" id="t2v-go">生成视频</button>
    <div class="result" id="t2v-result"></div>
  </section>

  <section class="panel" id="gallery">
    <div id="gallery-grid" class="grid"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3>设置</h3>
    <label>Base URL<input id="set-base" placeholder="https://apihub.agnes-ai.com/v1"></label>
    <label>API Key<input id="set-key" type="password" placeholder="Agnes API Key"></label>
    <div class="modal-actions">
      <button id="set-cancel">取消</button>
      <button class="primary" id="set-save">保存</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
